    <path d="M704 385 834 300v329q0 17-15 26l-111 67q-20 12-20-12V408Z" fill="url(#cyan)" />
    <path d="M414 405 610 522v217q0 15-13 23l-149 89q-23 14-23-14V454Z" fill="url(#blue)" mask="url(#caret-cutout)" />
    <path d="M190 159q15-9 30 0l395 235q23 14 6 34l-68 78q-12 14-28 4L329 393v316q0 20-17 30-12 7-24 0l-107-64q-17-10-17-30V184q0-17 14-25 6-4 12 0Z" fill="url(#cyan)" />
    <path d="M190 159q15-9 30 0l395 235" fill="none" stroke="#7BF3FA" stroke-opacity=".58" stroke-width="6" stroke-linecap="round" />
    <path d="M495 344 685 229q15-9 30 0l119 71" fill="none" stroke="#3A9CFF" stroke-opacity=".62" stroke-width="6" stroke-linecap="round" />
    <path d="M704 385 834 300v329" fill="none" stroke="#61ECF7" stroke-opacity=".45" stroke-width="5" stroke-linecap="round" />
