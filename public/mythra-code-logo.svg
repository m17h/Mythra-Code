<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Mythra Code</title>
  <desc id="description">A folded cyan and blue architectural M with a forward code caret.</desc>
  <defs>
    <linearGradient id="cyan" x1="170" y1="180" x2="620" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35E7F2" />
      <stop offset="1" stop-color="#08AEEA" />
    </linearGradient>
    <linearGradient id="blue" x1="430" y1="400" x2="610" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#148EFF" />
      <stop offset="1" stop-color="#1644E8" />
    </linearGradient>
    <linearGradient id="fold" x1="500" y1="230" x2="820" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#176BFA" />
      <stop offset="1" stop-color="#1247D9" />
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#087DFF" flood-opacity=".24" />
    </filter>
