[package]
name = "mythra-native-close-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "mythra-native-close-test"
path = "src/main.rs"

[[bin]]
name = "mythra-native-close-baseline"
path = "src/baseline.rs"

[[bin]]
name = "mythra-native-startup-test"
path = "src/startup.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows-core = "=0.61.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
