name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Lint, typecheck, test, and build
        run: npm run verify

      # The full browser suite already ran in Chromium as part of `verify`.
      # Repeat every configured browser spec in WebKit rather than a hand-kept
      # subset, so a new spec is covered on the macOS engine automatically.
      - name: Verify the browser suite in WebKit
        if: runner.os == 'macOS'
        run: |
          npx playwright install webkit
          npm run test:browser
        env:
          MYTHRA_BROWSER_TEST_ENGINE: webkit

      - name: Verify Windows renderer performance profile
        if: runner.os == 'Windows'
        run: npm run build && npm run verify:performance
        env:
          TAURI_ENV_PLATFORM: windows

      # Reuse the report written by verify:performance. No second build or
      # benchmark is added to the release path; the native harness is opt-in.
      - name: Upload renderer performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-scorecard-${{ matrix.os }}
          path: dist/performance-scorecard.json
          if-no-files-found: ignore
