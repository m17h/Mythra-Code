name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Lint, typecheck, test, and build
        run: npm run verify

      - name: Verify streaming and transcript layout in WebKit
        if: runner.os == 'macOS'
        run: |
          npx playwright install webkit
          npm run test:browser -- src/lib/streamingTextPacer.browser.test.ts src/lib/streamingTextFade.browser.test.ts src/components/ChatTimeline.streaming.browser.test.tsx src/components/ChatTimeline.cadence.browser.test.tsx src/components/ChatTimeline.layout.browser.test.tsx src/components/UsagePopover.browser.test.tsx src/components/ModelControls.layout.browser.test.tsx src/components/SettingsModal.animation.browser.test.tsx
        env:
          MYTHRA_BROWSER_TEST_ENGINE: webkit

      - name: Verify Windows renderer performance profile
        if: runner.os == 'Windows'
        run: npm run build && npm run verify:performance
        env:
          TAURI_ENV_PLATFORM: windows
