name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compiled_rust_cache:
        description: Trial dependency-only Rust caching (never skips checks)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  native:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update
      # Keep cargo commands together to reuse compilation and avoid build locks.
      - name: Cache downloaded crates
        if: vars.MYTHRA_COMPILED_RUST_CACHE != 'true' && inputs.compiled_rust_cache != true
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Trial compiled dependency cache
        if: vars.MYTHRA_COMPILED_RUST_CACHE == 'true' || inputs.compiled_rust_cache == true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, immutable revision
        with:
          workspaces: src-tauri -> target
          key: ${{ runner.os }}-${{ runner.arch }}-debug-${{ hashFiles('src-tauri/.cargo/**', 'src-tauri/build.rs', 'src-tauri/tauri*.json') }}
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      - name: Clippy, Cargo check, and complete Rust suite
        run: node scripts/verify-ci.mjs native
      - name: Upload native verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-native-${{ runner.os }}
          path: .test-artifacts/receipt-native-*.json
          include-hidden-files: true
          if-no-files-found: error

  unit:
    name: Unit (${{ matrix.os }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Keep maxWorkers: 2; these shards use separate machines, not more workers
      # sharing a machine and starving timer-heavy tests.
      - name: Run complete unit shard and record file inventory
        run: node scripts/verify-ci.mjs unit ${{ matrix.shard }}/2
      - name: Upload unit verification and test inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-unit-${{ runner.os }}-${{ matrix.shard }}
          path: .test-artifacts/*.json
          include-hidden-files: true
          if-no-files-found: error

  renderer:
    name: Renderer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Configuration, lint, types, Chromium, startup and performance
        run: node scripts/verify-ci.mjs renderer
      # Windows retains BOTH Safari13 and Chrome105 production profiles.
      # Reports are copied into the receipt before another build replaces them.
      - name: Upload renderer verification and performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-renderer-${{ runner.os }}
          path: .test-artifacts/*.json
          include-hidden-files: true
          if-no-files-found: error

  webkit:
    name: WebKit (macOS 15)
    # Keep the OS pin, serial file isolation and bounded batches: newer hosted
    # WebKit and concurrent file workers stalled. No browser coverage is removed.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - name: WebKit emitted-module startup and every browser spec
        run: node scripts/verify-ci.mjs webkit
      - name: Upload WebKit verification and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-webkit
          path: .test-artifacts/
          include-hidden-files: true
          if-no-files-found: error

  gate:
    name: Verify gate
    if: always()
    needs: [native, unit, renderer, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: verification-*
          path: .test-artifacts/
          merge-multiple: true
      - name: Require every lane, shard, report and matching commit input
        run: node scripts/verify-ci.mjs gate
        env:
          VERIFY_NEEDS: ${{ toJSON(needs) }}
